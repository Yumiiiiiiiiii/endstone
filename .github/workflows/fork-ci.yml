name: Fork Linux candidate

on:
  workflow_dispatch:
  push:
    branches: [dev, 'feature/**']
    paths: ['src/**', 'include/**', 'endstone/**', 'fork/**', '.github/workflows/fork-*', 'pyproject.toml', 'conanfile.py']
  pull_request:
    branches: [dev, stable]

permissions:
  contents: read

concurrency:
  group: fork-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate-tests:
    if: github.repository == 'Yumiiiiiiiiii/endstone'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s fork/tests -v
  wheel:
    if: github.repository == 'Yumiiiiiiiiii/endstone'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fork version
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          config = json.loads(Path('fork/config.json').read_text())
          origin = subprocess.check_output(['git','remote','get-url','origin'], text=True).strip()
          assert origin.removesuffix('.git') == 'https://github.com/' + config['repository'], origin
          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          version = config['base_version'] + '+ymii.g' + sha[:12]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SETUPTOOLS_SCM_PRETEND_VERSION=' + version + '\n')
              f.write('FORK_COMMIT=' + sha + '\n')
          PY
      - uses: actions/cache@v4
        with:
          path: .conan2
          key: fork-conan-linux-cp313-v1-${{ hashFiles('conanfile.py', 'pyproject.toml') }}
      - name: Build Fork source with upstream Conan / CMake / Clang toolchain
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_BUILD: cp313-manylinux_x86_64
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION
      - name: Run BDS smoke on actual native target
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4t64
          python -m pip install build hatchling wheelhouse/*.whl
          BDS=$(python -c "import json; print(json.load(open('fork/config.json'))['native_bds'])")
          python fork/runtime_smoke.py --bds "$BDS" --output reports/runtime.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fork-linux-${{ github.sha }}
          path: |
            wheelhouse/*.whl
            reports/
          retention-days: 14
  requested-bds-diagnostics:
    if: github.repository == 'Yumiiiiiiiiii/endstone'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install lief requests tomlkit click colorlog tqdm -r fork/requirements-analysis.txt
      - name: Probe new native signatures (failure keeps candidate red)
        run: python fork/probe_bds.py --version 1.26.60 --platform linux --output reports/bds-1.26.60.json
      - name: Compare ELF evidence without changing native headers
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          config=json.loads(Path('fork/config.json').read_text())
          subprocess.run([sys.executable,'fork/probe_bds.py','--version',config['native_bds'],
                          '--platform','linux','--output','reports/baseline-linux.json'],check=True)
          old=json.loads(Path('reports/baseline-linux.json').read_text())
          new=json.loads(Path('reports/bds-1.26.60.json').read_text())
          cache=Path('.cache/fork-bds/linux')
          subprocess.run([sys.executable,'fork/analyze_linux_bds.py',
                          '--baseline',str(cache/old['archive_filename']),
                          '--target',str(cache/new['archive_filename']),
                          '--target-version',config['requested_bds'],
                          '--output','reports/native-candidates-linux.json'],check=True)
          subprocess.run([sys.executable,'fork/align_linux_vtables.py',
                          '--baseline',str(cache/old['archive_filename']),
                          '--target',str(cache/new['archive_filename']),
                          '--target-version',config['requested_bds'],
                          '--output','reports/vtable-alignment-linux.json'],check=True)
          PY
      - name: Exercise reviewed Linux position candidate in an isolated process
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          cache=Path('.cache/fork-bds/linux')
          old=json.loads(Path('reports/baseline-linux.json').read_text())
          new=json.loads(Path('reports/bds-1.26.60.json').read_text())
          subprocess.run(['sudo','timeout','90','unshare','--net',sys.executable,
                          'fork/exercise_location_candidate.py',
                          '--baseline',str(cache/old['archive_filename']),
                          '--target',str(cache/new['archive_filename']),
                          '--output','reports/location-candidate-execution.json'],check=True)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-diagnostics-${{ github.sha }}
          path: reports/
